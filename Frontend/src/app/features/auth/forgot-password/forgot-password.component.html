<div class="min-h-screen bg-gray-soft flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-card p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-orange-100 rounded-2xl flex items-center justify-center mx-auto mb-4"><span class="text-3xl">🔑</span></div>
        <h1 class="text-2xl font-bold text-dark">Forgot Password?</h1>
        <p class="text-gray-500 text-sm mt-1">Enter your email and we'll send a reset link</p>
      </div>
      @if (!sent()) {
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
            <input [(ngModel)]="email" name="email" type="email" required placeholder="you@example.com" class="input-field" />
          </div>
          @if (error()) { <div class="bg-red-50 text-red-600 text-sm px-4 py-3 rounded-xl">⚠️ {{ error() }}</div> }
          <button type="submit" [disabled]="loading()" class="w-full btn-primary py-3 rounded-xl disabled:opacity-60">
            {{ loading() ? 'Sending...' : 'Send Reset Link' }}
          </button>
        </form>
      } @else {
        <div class="text-center py-4">
          <span class="text-5xl">📧</span>
          <p class="text-green-600 font-semibold mt-4">Reset link sent!</p>
          <p class="text-gray-500 text-sm mt-2">Check your email inbox and follow the link to reset your password.</p>
        </div>
      }
      <div class="mt-6 text-center text-sm">
        <a routerLink="/auth/login" class="text-primary font-medium hover:underline">← Back to Login</a>
      </div>
    </div>
  </div>
</div>
