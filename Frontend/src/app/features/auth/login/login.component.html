<div class="min-h-screen bg-gray-soft flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-card p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
          <span class="text-3xl">🍔</span>
        </div>
        <h1 class="text-2xl font-bold text-dark">Welcome back!</h1>
        <p class="text-gray-500 text-sm mt-1">Sign in to continue ordering</p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <input [(ngModel)]="email" name="email" type="email" required
            placeholder="you@example.com" class="input-field" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <input [(ngModel)]="password" name="password" [type]="showPwd() ? 'text' : 'password'" required
              placeholder="Enter your password" class="input-field pr-10" />
            <button type="button" (click)="showPwd.set(!showPwd())"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              {{ showPwd() ? '🙈' : '👁️' }}
            </button>
          </div>
          <div class="text-right mt-1">
            <a routerLink="/auth/forgot-password" class="text-xs text-primary hover:underline">Forgot password?</a>
          </div>
        </div>

        @if (error()) {
          <div class="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl flex items-center gap-2">
            <span>⚠️</span> {{ error() }}
          </div>
        }

        <button type="submit" [disabled]="loading()"
          class="w-full btn-primary py-3 text-base rounded-xl flex items-center justify-center gap-2 disabled:opacity-60">
          @if (loading()) { <span class="animate-spin">⏳</span> Signing in... }
          @else { Sign In }
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-500">
        Don't have an account?
        <a routerLink="/auth/register" class="text-primary font-semibold hover:underline ml-1">Sign up</a>
      </div>
    </div>
  </div>
</div>
