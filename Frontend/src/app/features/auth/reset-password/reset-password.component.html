<div class="min-h-screen bg-gray-soft flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-card p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-orange-100 rounded-2xl flex items-center justify-center mx-auto mb-4"><span class="text-3xl">🔒</span></div>
        <h1 class="text-2xl font-bold text-dark">Reset Password</h1>
        <p class="text-gray-500 text-sm mt-1">Enter your new password below</p>
      </div>
      @if (!done()) {
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
            <input [(ngModel)]="newPassword" name="newPassword" type="password" required minlength="8" placeholder="Min 8 characters" class="input-field" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
            <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required placeholder="Repeat password" class="input-field" />
          </div>
          @if (error()) { <div class="bg-red-50 text-red-600 text-sm px-4 py-3 rounded-xl">⚠️ {{ error() }}</div> }
          <button type="submit" [disabled]="loading()" class="w-full btn-primary py-3 rounded-xl disabled:opacity-60">
            {{ loading() ? 'Resetting...' : 'Reset Password' }}
          </button>
        </form>
      } @else {
        <div class="text-center py-4">
          <span class="text-5xl">✅</span>
          <p class="text-green-600 font-semibold mt-4">Password reset successfully!</p>
          <a routerLink="/auth/login" class="btn-primary inline-block mt-4 rounded-xl px-6 py-2">Sign In</a>
        </div>
      }
    </div>
  </div>
</div>
