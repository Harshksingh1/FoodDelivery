
<div class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-dark mb-6">My Profile</h1>

  @if (loading()) {
    <div class="bg-white rounded-2xl p-8 animate-pulse space-y-4">
      <div class="w-24 h-24 bg-gray-200 rounded-full mx-auto"></div>
      <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
    </div>
  } @else if (profile()) {
    <div class="bg-white rounded-2xl shadow-card p-6 space-y-6">
      <!-- Avatar -->
      <div class="flex flex-col items-center gap-3">
        <div class="w-24 h-24 rounded-full overflow-hidden bg-orange-100 flex items-center justify-center">
          <span class="text-4xl font-bold text-primary">{{ profile()!.fullName.charAt(0).toUpperCase() }}</span>
        </div>
        <div class="text-center">
          <p class="font-bold text-dark text-lg">{{ profile()!.fullName }}</p>
          <span class="badge bg-orange-100 text-primary text-xs px-2 py-0.5 rounded-full">{{ profile()!.role }}</span>
        </div>
      </div>

      <!-- Edit form -->
      <form (ngSubmit)="onSave()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
            <input [(ngModel)]="form.fullName" name="fullName" type="text" required class="input-field" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Mobile</label>
            <input [(ngModel)]="form.mobile" name="mobile" type="tel" required class="input-field" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input [value]="profile()!.email" type="email" disabled class="input-field bg-gray-50 text-gray-400 cursor-not-allowed" />
          </div>
        </div>
        <button type="submit" [disabled]="saving()" class="btn-primary py-2.5 px-6 rounded-xl disabled:opacity-60">
          {{ saving() ? 'Saving...' : 'Save Changes' }}
        </button>
      </form>

      <!-- Change Password -->
      <div class="border-t border-gray-100 pt-6">
        <h3 class="font-semibold text-dark mb-4">Change Password</h3>
        <form (ngSubmit)="onChangePassword()" class="space-y-3">
          <input [(ngModel)]="pwd.current" name="current" type="password" placeholder="Current password" class="input-field" />
          <input [(ngModel)]="pwd.newPwd" name="newPwd" type="password" placeholder="New password (min 8 chars)" class="input-field" />
          <input [(ngModel)]="pwd.confirm" name="confirm" type="password" placeholder="Confirm new password" class="input-field" />
          @if (pwdError()) { <p class="text-red-500 text-sm">⚠️ {{ pwdError() }}</p> }
          <button type="submit" [disabled]="pwdLoading()" class="btn-outline py-2.5 px-6 rounded-xl disabled:opacity-60">
            {{ pwdLoading() ? 'Updating...' : 'Update Password' }}
          </button>
        </form>
      </div>
    </div>
  }
</div>
