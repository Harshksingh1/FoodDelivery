<div class="fixed top-20 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
  @for (t of toast.toasts(); track t.id) {
    <div class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium min-w-64 max-w-sm animate-slide-in"
      [class.bg-green-500]="t.type === 'success'"
      [class.bg-red-500]="t.type === 'error'"
      [class.bg-blue-500]="t.type === 'info'"
      [class.text-white]="true">
      <span>{{ t.type === 'success' ? '✅' : t.type === 'error' ? '❌' : 'ℹ️' }}</span>
      <span class="flex-1">{{ t.message }}</span>
      <button (click)="toast.remove(t.id)" class="opacity-70 hover:opacity-100">✕</button>
    </div>
  }
</div>
